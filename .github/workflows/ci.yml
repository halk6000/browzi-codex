name: Browzi CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Verify MCP imports
        run: node --input-type=module -e "await import('@modelcontextprotocol/sdk/server/mcp.js'); await import('playwright'); await import('zod'); console.log('Imports OK')"
